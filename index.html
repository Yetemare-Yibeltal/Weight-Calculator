<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weight Lab · Fullstack</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Animated background overlay -->
  <div class="bg-animation"></div>

  <div class="app-wrapper">
    <!-- Header -->
    <header>
      <h1>⚖️ Weight Lab</h1>
      <p class="subtitle">Convert · Track · Analyse</p>
    </header>

    <!-- Main Content - Vertical Stack -->
    <main class="dashboard">
      <!-- Converter Card -->
      <section class="card converter-card">
        <div class="card-header">
          <span class="card-icon">🔄</span>
          <h2>Converter</h2>
        </div>

        <div class="input-group">
          <label for="weight">Weight</label>
          <input type="number" id="weight" placeholder="0.00" step="any" />
        </div>

        <div class="row">
          <div class="input-group">
            <label for="from-unit">From</label>
            <select id="from-unit">
              <option value="kg">⚖️ Kilograms</option>
              <option value="g">📦 Grams</option>
              <option value="lbs">🏋️ Pounds</option>
              <option value="oz">⚡ Ounces</option>
              <option value="stones">🪨 Stones</option>
            </select>
          </div>
          <div class="input-group">
            <label for="to-unit">To</label>
            <select id="to-unit">
              <option value="kg">⚖️ Kilograms</option>
              <option value="g">📦 Grams</option>
              <option value="lbs" selected>🏋️ Pounds</option>
              <option value="oz">⚡ Ounces</option>
              <option value="stones">🪨 Stones</option>
            </select>
          </div>
        </div>

        <button id="convert-btn" class="btn-primary">Convert</button>
        <button id="reset-btn" class="btn-secondary">↺ Reset</button>

        <div id="result" class="result"></div>
      </section>

      <!-- History Card -->
      <section class="card history-card">
        <div class="card-header">
          <span class="card-icon">📋</span>
          <h2>History</h2>
          <button id="clear-history-btn" class="btn-danger">Clear All</button>
        </div>
        <ul id="history-list" class="history-list">
          <li class="empty-history">No conversions yet</li>
        </ul>
      </section>
    </main>

    <!-- Footer -->
    <footer>
      <p>Built with ❤️ · Fullstack Weight Lab</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
